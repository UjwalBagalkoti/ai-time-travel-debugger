services:
  - type: web
    name: ai-time-travel-debugger-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-time-travel-debugger-db
          property: connectionString

  - type: web
    name: ai-time-travel-debugger
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-time-travel-debugger-api.onrender.com

databases:
  - name: ai-time-travel-debugger-db
    plan: free
    region: singapore
    postgresMajorVersion: 18
