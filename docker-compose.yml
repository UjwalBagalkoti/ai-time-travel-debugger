services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_debugger
      POSTGRES_USER: debugger
      POSTGRES_PASSWORD: debugger
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://debugger:debugger@postgres:5432/agent_debugger
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on: [postgres]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  postgres_data: